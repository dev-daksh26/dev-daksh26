<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16" />
      <stop offset="100%" stop-color="#0c152c" />
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <style>
    .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #cbd5e1; font-weight: 600; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; fill: #94a3b8; }
    .slide-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #247bff; }
  </style>

  <rect width="850" height="320" rx="20" fill="url(#aboutBg)" stroke="url(#cardBorder)" stroke-width="1.2" />

  <!-- Left Column: Core Focus & Capabilities -->
  <g transform="translate(40, 40)">
    <text x="0" y="0" class="section-title">Core Engineering Pillars</text>
    
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="350" height="60" rx="10" fill="#0d1833" stroke="#247bff" stroke-opacity="0.25" />
      <circle cx="25" cy="30" r="10" fill="#247bff" fill-opacity="0.2" />
      <text x="48" y="27" class="label">Full-Stack Application Design</text>
      <text x="48" y="45" class="desc">Python backends, REST APIs, reactive client UI</text>
    </g>

    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="350" height="60" rx="10" fill="#0d1833" stroke="#ff354f" stroke-opacity="0.25" />
      <circle cx="25" cy="30" r="10" fill="#ff354f" fill-opacity="0.2" />
      <text x="48" y="27" class="label">Applied LLMs & Document AI</text>
      <text x="48" y="45" class="desc">Gemini & OpenAI pipelines, OCR indexing, automation</text>
    </g>

    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="350" height="60" rx="10" fill="#0d1833" stroke="#247bff" stroke-opacity="0.25" />
      <circle cx="25" cy="30" r="10" fill="#247bff" fill-opacity="0.2" />
      <text x="48" y="27" class="label">Community Software & Bot Tools</text>
      <text x="48" y="45" class="desc">Modular Discord bots, event handlers, interactive utilities</text>
    </g>
  </g>

  <!-- Right Column: 3-Slide Carousel (4s per slide = 12s loop) -->
  <g transform="translate(440, 40)">
    <text x="0" y="0" class="section-title">Beyond The Terminal</text>

    <!-- Carousel Progress Bars -->
    <g transform="translate(0, 18)">
      <!-- Segment 1 Progress -->
      <rect x="0" y="0" width="115" height="3" rx="1.5" fill="#1e293b" />
      <rect x="0" y="0" width="0" height="3" rx="1.5" fill="#247bff">
        <animate attributeName="width" values="0;115;115;0" keyTimes="0;0.33;0.34;1" dur="12s" repeatCount="indefinite" />
      </rect>
      <!-- Segment 2 Progress -->
      <rect x="125" y="0" width="115" height="3" rx="1.5" fill="#1e293b" />
      <rect x="125" y="0" width="0" height="3" rx="1.5" fill="#247bff">
        <animate attributeName="width" values="0;0;115;115;0" keyTimes="0;0.33;0.66;0.67;1" dur="12s" repeatCount="indefinite" />
      </rect>
      <!-- Segment 3 Progress -->
      <rect x="250" y="0" width="115" height="3" rx="1.5" fill="#1e293b" />
      <rect x="250" y="0" width="0" height="3" rx="1.5" fill="#247bff">
        <animate attributeName="width" values="0;0;115;115" keyTimes="0;0.66;0.99;1" dur="12s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Card Body Container -->
    <rect x="0" y="32" width="370" height="196" rx="12" fill="#0d1833" stroke="#247bff" stroke-opacity="0.2" />

    <!-- Slide 1: Competitive Gaming -->
    <g opacity="1">
      <animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.30;0.33;0.96;0.98;1" dur="12s" repeatCount="indefinite" />
      <text x="24" y="75" class="slide-title">Competitive Gaming</text>
      <text x="24" y="105" class="desc">High-speed tactical decision-making, clutch play, and</text>
      <text x="24" y="125" class="desc">team coordination across competitive multiplayer arenas.</text>
      <rect x="24" y="145" width="105" height="24" rx="6" fill="#131c38" />
      <text x="35" y="161" font-family="monospace" font-size="11" fill="#ff354f">#Tactical</text>
      <rect x="140" y="145" width="105" height="24" rx="6" fill="#131c38" />
      <text x="150" y="161" font-family="monospace" font-size="11" fill="#247bff">#FastReflexes</text>
    </g>

    <!-- Slide 2: Keyboard / Piano -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.36;0.63;0.66;1" dur="12s" repeatCount="indefinite" />
      <text x="24" y="75" class="slide-title">Piano & Arranger Keyboard</text>
      <text x="24" y="105" class="desc">Experimenting with harmonies, rhythmic grooves,</text>
      <text x="24" y="125" class="desc">sampling patterns, and creative sound exploration.</text>
      <rect x="24" y="145" width="115" height="24" rx="6" fill="#131c38" />
      <text x="35" y="161" font-family="monospace" font-size="11" fill="#247bff">#Harmonies</text>
      <rect x="150" y="145" width="100" height="24" rx="6" fill="#131c38" />
      <text x="160" y="161" font-family="monospace" font-size="11" fill="#ff354f">#Acoustics</text>
    </g>

    <!-- Slide 3: Anime Sketching -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.69;0.96;0.99" dur="12s" repeatCount="indefinite" />
      <text x="24" y="75" class="slide-title">Anime Character Sketching</text>
      <text x="24" y="105" class="desc">Translating expressive character line art, deep</text>
      <text x="24" y="125" class="desc">ink shading, dynamic silhouettes, and anatomical detail.</text>
      <rect x="24" y="145" width="115" height="24" rx="6" fill="#131c38" />
      <text x="35" y="161" font-family="monospace" font-size="11" fill="#247bff">#Illustration</text>
      <rect x="150" y="145" width="95" height="24" rx="6" fill="#131c38" />
      <text x="160" y="161" font-family="monospace" font-size="11" fill="#ff354f">#LineWork</text>
    </g>
  </g>
</svg>