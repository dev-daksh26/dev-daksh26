<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16" />
      <stop offset="100%" stop-color="#0a1226" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#247bff" />
    </linearGradient>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <clipPath id="portraitHeroClip">
      <rect x="520" y="20" width="310" height="380" rx="20" />
    </clipPath>
  </defs>

  <style>
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .cursor { animation: blink 0.9s infinite; }
    .role-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 19px; font-weight: 600; fill: #247bff; }
    .title-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 52px; font-weight: 900; letter-spacing: -1.5px; fill: url(#textGrad); }
    .sub-pitch { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; fill: #94a3b8; line-height: 1.5; }
    .meta-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 12px; fill: #cbd5e1; }
    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; opacity: 1; }
      .anim-role { animation: none !important; opacity: 1 !important; }
    }
  </style>

  <rect x="2" y="2" width="846" height="416" rx="24" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <g transform="translate(48, 55)">
    <text x="0" y="20" font-family="monospace" font-size="14" fill="#ff354f" font-weight="700">~/welcome-to-space $</text>
    <text x="185" y="20" font-family="monospace" font-size="14" fill="#e2e8f0" font-weight="500">whoami</text>
    <rect x="245" y="7" width="8" height="15" fill="#247bff" class="cursor" />

    <text x="0" y="85" class="title-name">Daksh Saxena</text>

    <g transform="translate(0, 125)">
      <rect x="0" y="-20" width="380" height="32" rx="8" fill="#131c38" stroke="#247bff" stroke-opacity="0.3" />
      <circle cx="16" cy="-4" r="4" fill="#247bff" />
      
      <text x="32" y="2" class="role-text anim-role">
        Full-Stack Developer
        <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.22;0.25;0.47;0.50;0.72;0.75;0.97;1" dur="12s" repeatCount="indefinite" />
      </text>
      <text x="32" y="2" class="role-text anim-role" opacity="0">
        AI/ML Solutions Builder
        <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.22;0.25;0.47;0.50;0.72;0.75;0.97;1" dur="12s" repeatCount="indefinite" />
      </text>
      <text x="32" y="2" class="role-text anim-role" opacity="0">
        Software Engineering Intern
        <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.47;0.50;0.72;0.75;0.97;0.98;0.99;1" dur="12s" repeatCount="indefinite" />
      </text>
      <text x="32" y="2" class="role-text anim-role" opacity="0">
        Open Source Contributor
        <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" keyTimes="0;0.72;0.75;0.97;0.98;0.99;0.995;0.999;1" dur="12s" repeatCount="indefinite" />
      </text>
    </g>

    <g transform="translate(0, 175)">
      <text x="0" y="0" class="sub-pitch">Aspiring software engineer building modern full-stack web</text>
      <text x="0" y="24" class="sub-pitch">applications, developer tools, and intelligent AI systems.</text>
    </g>

    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="165" height="32" rx="16" fill="#0d1833" stroke="#247bff" stroke-opacity="0.3" />
      <path d="M16 16c0-3.3 2.7-6 6-6s6 2.7 6 6c0 4.5-6 10-6 10s-6-5.5-6-10z" fill="#ff354f" />
      <circle cx="22" cy="16" r="2" fill="#070b16" />
      <text x="36" y="20" class="meta-tag">Jaipur, Rajasthan</text>

      <rect x="175" y="0" width="220" height="32" rx="16" fill="#0d1833" stroke="#247bff" stroke-opacity="0.3" />
      <path d="M192 12l8-4 8 4-8 4-8-4zm0 6l8 4 8-4M192 21l8 4 8-4" fill="none" stroke="#247bff" stroke-width="1.5" />
      <text x="214" y="20" class="meta-tag">CS @ Poornima PIET</text>
    </g>
  </g>

  <g clip-path="url(#portraitHeroClip)">
    <circle cx="675" cy="200" r="140" fill="#247bff" fill-opacity="0.12" filter="url(#glowBlue)" />
    <circle cx="740" cy="160" r="90" fill="#ff354f" fill-opacity="0.08" filter="url(#glowBlue)" />
    
  </g>
</svg>