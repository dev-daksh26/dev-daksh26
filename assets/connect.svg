<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="connectBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16" />
      <stop offset="100%" stop-color="#0d1936" />
    </linearGradient>
    <linearGradient id="connectBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff354f" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#247bff" stop-opacity="0.7" />
    </linearGradient>
    <clipPath id="pointingClip">
      <rect x="0" y="0" width="410" height="420" rx="20" />
    </clipPath>
  </defs>

  <style>
    @keyframes arrowNudge {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(6px); }
    }
    .arrow-icon { animation: arrowNudge 1.8s ease-in-out infinite; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .card-handle { font-family: monospace; font-size: 12px; fill: #94a3b8; }
    @media (prefers-reduced-motion: reduce) {
      .arrow-icon { animation: none !important; }
    }
  </style>

  <rect width="850" height="420" rx="24" fill="url(#connectBg)" stroke="url(#connectBorder)" stroke-width="1.5" />

  <g clip-path="url(#pointingClip)">
    <circle cx="210" cy="220" r="140" fill="#247bff" fill-opacity="0.1" />
    
  </g>

  <g transform="translate(420, 36)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#ffffff">Let's Build Together</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">Connect across platforms or book a 1:1 mentorship session.</text>

    <g transform="translate(0, 56)">
      <rect width="390" height="60" rx="12" fill="#0d1936" stroke="#247bff" stroke-width="1.2" />
      <rect x="16" y="14" width="32" height="32" rx="6" fill="#0077b5" />
      <text x="32" y="36" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="900" fill="#ffffff">in</text>
      <text x="62" y="28" class="card-title">LinkedIn</text>
      <text x="62" y="47" class="card-handle">in/dev-daksh26</text>
      <path class="arrow-icon" d="M355 30 L345 23 L345 37 Z" fill="#247bff" />
    </g>

    <g transform="translate(0, 126)">
      <rect width="390" height="60" rx="12" fill="#0d1936" stroke="#ff354f" stroke-width="1.2" />
      <rect x="16" y="14" width="32" height="32" rx="6" fill="#ff0000" />
      <polygon points="28,22 39,30 28,38" fill="#ffffff" />
      <text x="62" y="28" class="card-title">YouTube</text>
      <text x="62" y="47" class="card-handle">@dev-daksh26</text>
      <path class="arrow-icon" d="M355 30 L345 23 L345 37 Z" fill="#ff354f" />
    </g>

    <g transform="translate(0, 196)">
      <rect width="390" height="60" rx="12" fill="#0d1936" stroke="#247bff" stroke-width="1.2" />
      <rect x="16" y="14" width="32" height="32" rx="6" fill="#ff5722" />
      <text x="32" y="36" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff">T</text>
      <text x="62" y="28" class="card-title">Topmate (1:1 Mentorship)</text>
      <text x="62" y="47" class="card-handle">topmate.io/daksh_saxena</text>
      <path class="arrow-icon" d="M355 30 L345 23 L345 37 Z" fill="#247bff" />
    </g>

    <g transform="translate(0, 266)">
      <rect width="390" height="60" rx="12" fill="#0d1936" stroke="#e1306c" stroke-width="1.2" />
      <rect x="16" y="14" width="32" height="32" rx="6" fill="#e1306c" />
      <circle cx="32" cy="30" r="7" fill="none" stroke="#ffffff" stroke-width="2" />
      <circle cx="37" cy="23" r="1.5" fill="#ffffff" />
      <text x="62" y="28" class="card-title">Instagram</text>
      <text x="62" y="47" class="card-handle">@dev.daksh</text>
      <path class="arrow-icon" d="M355 30 L345 23 L345 37 Z" fill="#e1306c" />
    </g>
  </g>
</svg>