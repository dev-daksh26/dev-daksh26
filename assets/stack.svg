<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%">
  <defs>
    <linearGradient id="stackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16" />
      <stop offset="100%" stop-color="#0b1328" />
    </linearGradient>
    <linearGradient id="stackBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <style>
    .cat-head { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #ff354f; letter-spacing: 1px; text-transform: uppercase; }
    .badge-txt { font-family: monospace; font-size: 12px; font-weight: 600; fill: #f1f5f9; }
    .orbit-label { font-family: monospace; font-size: 11px; fill: #38bdf8; font-weight: 600; }
  </style>

  <rect width="850" height="360" rx="20" fill="url(#stackBg)" stroke="url(#stackBorder)" stroke-width="1.2" />

  <g transform="translate(180, 180)">
    <circle cx="0" cy="0" r="28" fill="#131c38" stroke="#247bff" stroke-width="2" />
    <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffffff" font-weight="700">CORE</text>

    <ellipse cx="0" cy="0" rx="75" ry="32" fill="none" stroke="#247bff" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" transform="rotate(-15)" />
    <g transform="rotate(-15)">
      <circle cx="75" cy="0" r="14" fill="#0b1736" stroke="#247bff" stroke-width="1.5">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite" />
      </circle>
      <text x="75" y="4" text-anchor="middle" class="orbit-label">Py</text>
      
      <circle cx="-75" cy="0" r="14" fill="#0b1736" stroke="#247bff" stroke-width="1.5" />
      <text x="-75" y="4" text-anchor="middle" class="orbit-label">C</text>
    </g>

    <ellipse cx="0" cy="0" rx="120" ry="52" fill="none" stroke="#ff354f" stroke-width="1" stroke-dasharray="4,4" opacity="0.5" transform="rotate(25)" />
    <g transform="rotate(25)">
      <circle cx="120" cy="0" r="15" fill="#1a0c18" stroke="#ff354f" stroke-width="1.5" />
      <text x="120" y="4" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff354f">JS</text>
      
      <circle cx="-120" cy="0" r="15" fill="#1a0c18" stroke="#ff354f" stroke-width="1.5" />
      <text x="-120" y="4" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff354f">HTML</text>
    </g>

    <ellipse cx="0" cy="0" rx="160" ry="70" fill="none" stroke="#247bff" stroke-width="1" stroke-dasharray="5,5" opacity="0.4" transform="rotate(-30)" />
    <g transform="rotate(-30)">
      <circle cx="160" cy="0" r="16" fill="#0b1736" stroke="#247bff" stroke-width="1.5" />
      <text x="160" y="4" text-anchor="middle" class="orbit-label">AI</text>
      
      <circle cx="-160" cy="0" r="16" fill="#0b1736" stroke="#247bff" stroke-width="1.5" />
      <text x="-160" y="4" text-anchor="middle" class="orbit-label">API</text>
    </g>
  </g>

  <g transform="translate(390, 42)">
    <text x="0" y="15" class="cat-head">Languages and Core</text>
    <g transform="translate(0, 26)">
      <rect x="0" y="0" width="85" height="30" rx="8" fill="#0e1a38" stroke="#247bff" stroke-opacity="0.3" />
      <text x="15" y="20" class="badge-txt">Python</text>
      <rect x="95" y="0" width="45" height="30" rx="8" fill="#0e1a38" stroke="#247bff" stroke-opacity="0.3" />
      <text x="110" y="20" class="badge-txt">C</text>
      <rect x="150" y="0" width="115" height="30" rx="8" fill="#0e1a38" stroke="#247bff" stroke-opacity="0.3" />
      <text x="163" y="20" class="badge-txt">JavaScript</text>
      <rect x="275" y="0" width="70" height="30" rx="8" fill="#0e1a38" stroke="#247bff" stroke-opacity="0.3" />
      <text x="286" y="20" class="badge-txt">HTML5</text>
      <rect x="355" y="0" width="65" height="30" rx="8" fill="#0e1a38" stroke="#247bff" stroke-opacity="0.3" />
      <text x="368" y="20" class="badge-txt">CSS3</text>
    </g>

    <text x="0" y="90" class="cat-head">AI and Machine Intelligence</text>
    <g transform="translate(0, 101)">
      <rect x="0" y="0" width="115" height="30" rx="8" fill="#180e22" stroke="#ff354f" stroke-opacity="0.35" />
      <text x="14" y="20" class="badge-txt">OpenAI API</text>
      <rect x="125" y="0" width="115" height="30" rx="8" fill="#180e22" stroke="#ff354f" stroke-opacity="0.35" />
      <text x="138" y="20" class="badge-txt">Gemini API</text>
      <rect x="250" y="0" width="125" height="30" rx="8" fill="#180e22" stroke="#ff354f" stroke-opacity="0.35" />
      <text x="260" y="20" class="badge-txt">Tesseract OCR</text>
    </g>

    <text x="0" y="165" class="cat-head">Frameworks, Cloud and Tools</text>
    <g transform="translate(0, 176)">
      <rect x="0" y="0" width="95" height="30" rx="8" fill="#0e1a38" stroke="#247bff" stroke-opacity="0.3" />
      <text x="14" y="20" class="badge-txt">Streamlit</text>
      <rect x="105" y="0" width="95" height="30" rx="8" fill="#0e1a38" stroke="#247bff" stroke-opacity="0.3" />
      <text x="117" y="20" class="badge-txt">REST APIs</text>
      <rect x="210" y="0" width="55" height="30" rx="8" fill="#0e1a38" stroke="#247bff" stroke-opacity="0.3" />
      <text x="223" y="20" class="badge-txt">Git</text>
      <rect x="275" y="0" width="75" height="30" rx="8" fill="#0e1a38" stroke="#247bff" stroke-opacity="0.3" />
      <text x="287" y="20" class="badge-txt">GitHub</text>
      <rect x="360" y="0" width="70" height="30" rx="8" fill="#0e1a38" stroke="#247bff" stroke-opacity="0.3" />
      <text x="372" y="20" class="badge-txt">Vercel</text>
    </g>

    <g transform="translate(0, 216)">
      <rect x="0" y="0" width="80" height="30" rx="8" fill="#0e1a38" stroke="#247bff" stroke-opacity="0.3" />
      <text x="14" y="20" class="badge-txt">Render</text>
      <rect x="90" y="0" width="140" height="30" rx="8" fill="#0e1a38" stroke="#247bff" stroke-opacity="0.3" />
      <text x="102" y="20" class="badge-txt">Discord API</text>
    </g>
  </g>
</svg>
