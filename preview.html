<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Profile SVG Suite Preview - Daksh</title>
  <style>
    body {
      background-color: #040711;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 850px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .preview-card {
      background: #070b16;
      border: 1px solid #1e293b;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #247bff;
      margin: 0 0 10px 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="preview-card">
      <h2>01 / Hero Component</h2>
      <img src="assets/hero.svg?v=1" alt="Hero">
    </div>
    <div class="preview-card">
      <h2>02 / About & Carousel Component</h2>
      <img src="assets/about-life.svg?v=1" alt="About">
    </div>
    <div class="preview-card">
      <h2>03 / Tech Stack Orbit Component</h2>
      <img src="assets/stack.svg?v=1" alt="Stack">
    </div>
    <div class="preview-card">
      <h2>04 / ID Lanyard & Metrics Component</h2>
      <img src="assets/id-dashboard.svg?v=1" alt="ID Dashboard">
    </div>
    <div class="preview-card">
      <h2>05 / Connect & Pointing Component</h2>
      <img src="assets/connect.svg?v=1" alt="Connect">
    </div>
  </div>
</body>
</html>
